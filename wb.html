<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日语动画职位批量翻译为中文 (带人物搜索)</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        textarea {
            width: 80%;
            max-width: 600px;
            min-height: 200px;
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        #translationResult {
            width: 80%;
            max-width: 600px;
            min-height: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            white-space: pre-wrap;
        }
        .search-button {
            padding: 5px 10px;
            background-color: #007bff; /* 蓝色按钮 */
            color: white;
            border: none;
            cursor: pointer;
            margin-left: 10px;
            font-size: 0.9em; /* 稍微小一点的字体 */
        }
        .search-button:hover {
            background-color: #0056b3;
        }
        .translation-line {
            display: flex; /* 使用 Flexbox 布局 */
            align-items: baseline; /* 按钮和文本基线对齐 */
            margin-bottom: 5px; /* 行间距 */
        }
    </style>
</head>
<body>
    <h1>日语动画职位批量翻译为中文 (带人物搜索)</h1>
    <textarea id="japaneseJobText" placeholder="在此粘贴日语职位列表"></textarea>
    <button id="translateButton">翻译为中文</button>
    <div id="translationResult">翻译结果将显示在此处</div>

    <script>
        const japaneseJobTextarea = document.getElementById('japaneseJobText');
        const translateButton = document.getElementById('translateButton');
        const translationResultDiv = document.getElementById('translationResult');

        // 动画职位翻译字典 (与之前相同，可以扩展)
        const animationJobTitleDictionary = {
            "総監督": "总导演",
            "監督": "导演",
            "演出": "演出/分镜演出",
            "作画監督": "作画监督/动画导演",
            "原画": "原画",
            "動画": "动画",
            "キャラクターデザイン": "角色设计",
            "サブキャラクターデザイン": "次要角色设计",
            "メカニックデザイン": "机械设计",
            "美術監督": "美术监督/背景美术指导",
            "色彩設計": "色彩设计",
            "撮影監督": "摄影监督/摄影指导",
            "音響監督": "音响监督/声音导演",
            "音楽": "音乐",
            "プロデューサー": "制片人",
            "アニメーションプロデューサー": "动画制片人",
            "制作進行": "制作进行/制片助理",
            "設定制作": "设定制作",
            "脚本": "剧本",
            "絵コンテ": "绘分镜/故事板",
            "3DCGアニメーター": "3DCG动画师",
            "モデラー": "建模师",
            "リギングアーティスト": "绑定艺术家",
            "アニメーション制作": "动画制作",
            "制作デスク": "制作デスク/制片部门",
        };

        translateButton.addEventListener('click', () => {
            const japaneseText = japaneseJobTextarea.value.trim();

            if (!japaneseText) {
                alert("请粘贴日语职位列表！");
                return;
            }

            const lines = japaneseText.split('\n');
            let translatedHTML = []; // 改为存储 HTML 字符串

            for (const line of lines) {
                const parts = line.split('：');
                if (parts.length === 2) {
                    const jobTitle = parts[0].trim();
                    const personName = parts[1].trim();
                    const translatedTitle = animationJobTitleDictionary[jobTitle];

                    if (translatedTitle) {
                        const translatedLineText = `${translatedTitle}：${personName}`;
                        const searchButtonHTML = `<button class="search-button" data-name="${personName}">Google 搜索</button>`;
                        translatedHTML.push(`<div class="translation-line">${translatedLineText}${searchButtonHTML}</div>`); // 使用 div 包裹，包含文本和按钮
                    } else {
                        translatedHTML.push(`<div class="translation-line">${line}</div>`); // 未翻译的行也用 div 包裹
                    }
                } else {
                    translatedHTML.push(`<div class="translation-line">${line}</div>`); // 格式不正确的行也用 div 包裹
                }
            }

            translationResultDiv.innerHTML = translatedHTML.join(''); // 使用 innerHTML 设置 HTML 内容

            // 事件委托处理 Google 搜索按钮点击
            translationResultDiv.addEventListener('click', function(event) {
                if (event.target.classList.contains('search-button')) {
                    const personName = event.target.dataset.name;
                    if (personName) {
                        const googleSearchUrl = `https://www.google.com/search?q=${encodeURIComponent(personName)}`;
                        window.open(googleSearchUrl, '_blank'); // 在新标签页打开
                    }
                }
            });

        });
    </script>
</body>
</html>
